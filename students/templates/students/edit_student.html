{% extends "students/base.html" %}

{% block title %}
    Edit Student
{% endblock %}

{% block page_title %}
    Edit Student
{% endblock %}

{% block content %}

<div class="page-header">
    <h2>Edit Student</h2>
</div>

<div class="form-container">

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <div style="margin-top: 20px;">

            <button type="submit" class="btn btn-primary">
                Update Student
            </button>

            <a href="{% url 'student_list' %}" class="btn btn-secondary">
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
