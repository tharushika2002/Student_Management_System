<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>
</head>

<body>

    <h1>Student Management System</h1>

    <h2>Students</h2>

    <a href="{% url 'add_student' %}">
        Add Student
    </a>

    <br>
    <br>

    {% if students %}

        <table border="1">

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Age</th>
                    <th>Course</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>

                {% for student in students %}

                <tr>
                    <td>{{ student.id }}</td>
                    <td>{{ student.name }}</td>
                    <td>{{ student.email }}</td>
                    <td>{{ student.age }}</td>
                    <td>{{ student.course }}</td>

                    <td>
                        <a href="{% url 'edit_student' student.id %}">
                            Edit
                        </a>
                    </td>
                </tr>

                {% endfor %}

            </tbody>

        </table>

    {% else %}

        <p>No students found.</p>

    {% endif %}

</body>

</html>
